# Declarative Automation Bundle do ecommerce_lakehouse: arquitetura medalhão no Databricks
# (bronze -> silver -> gold -> dashboards AI/BI -> agentes Genie).
# Nenhum valor do workspace fica fixo aqui: o host vem do perfil da CLI (--profile) ou de
# DATABRICKS_HOST, e o resto vem das variáveis abaixo.
bundle:
  name: ecommerce_lakehouse
  uuid: 2f8182e1-424c-4610-9ff7-154153bb7651

include:
  - resources/*.yml

# Um catálogo por ambiente: os schemas (bronze/silver/gold) e as tabelas têm o mesmo nome em
# dev e prod, só o catálogo muda. Diretorias e Genie só recebem acesso ao catálogo de prod.
variables:
  catalog:
    description: Catálogo do ambiente (ecommerce_lakehouse_dev ou ecommerce_lakehouse)
  schema:
    description: Schema padrão da pipeline
  warehouse_id:
    description: SQL warehouse usado pelos dashboards AI/BI e pelo Genie
    lookup:
      warehouse: "Serverless Starter Warehouse"
  prod_owner:
    description: >-
      Usuário dono de prod (email). Define a pasta de deploy e recebe CAN_MANAGE. Padrão: quem
      faz o deploy. No CI, que roda como service principal, é passado via --var.
    default: ${workspace.current_user.userName}
  ci_service_principal:
    description: Service principal do GitHub Actions (CAN_MANAGE em prod para validar no CI)
    lookup:
      service_principal: sp_ci_github

targets:
  dev:
    # Recursos prefixados com '[dev <usuário>]' e agendamentos pausados automaticamente.
    mode: development
    default: true
    variables:
      catalog: ecommerce_lakehouse_dev
      schema: silver
  prod:
    mode: production
    workspace:
      # Pasta fixa no usuário dono: uma única cópia de prod, seja quem for que faça o deploy.
      root_path: /Workspace/Users/${var.prod_owner}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ecommerce_lakehouse
      schema: silver
    permissions:
      - user_name: ${var.prod_owner}
        level: CAN_MANAGE
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_MANAGE
