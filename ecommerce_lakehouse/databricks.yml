# Declarative Automation Bundle for ecommerce_lakehouse: a Databricks medallion-architecture
# portfolio project (bronze -> silver -> gold -> AI/BI dashboards -> Genie agents).
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ecommerce_lakehouse
  uuid: 2f8182e1-424c-4610-9ff7-154153bb7651

include:
  - resources/*.yml

# Um catálogo por ambiente: os schemas (bronze/silver/gold) e as tabelas têm o mesmo nome em
# dev e prod, só o catálogo muda. Diretorias e Genie só recebem acesso ao catálogo de prod.
variables:
  catalog:
    description: Catálogo do ambiente (ecommerce_lakehouse_dev ou ecommerce_lakehouse)
  schema:
    description: Schema padrão da pipeline
  warehouse_id:
    description: SQL warehouse usado pelos dashboards AI/BI
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b2999451-9f53.cloud.databricks.com
    variables:
      catalog: ecommerce_lakehouse_dev
      schema: silver
  prod:
    mode: production
    workspace:
      host: https://dbc-b2999451-9f53.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mateusvvas@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mateusvvas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ecommerce_lakehouse
      schema: silver
    permissions:
      - user_name: mateusvvas@gmail.com
        level: CAN_MANAGE
      # sp_ci_github: identidade do GitHub Actions. Precisa de Manage na pasta de deploy de
      # prod para validar o target no CI; credencial guardada só nos secrets do GitHub.
      - service_principal_name: 2de18294-6b0e-4f10-a12a-0d4e7cc46fdf
        level: CAN_MANAGE
