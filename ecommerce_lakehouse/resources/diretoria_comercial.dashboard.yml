# Dashboard AI/BI da Diretoria Comercial: quanto vendemos, quando, em qual canal e com quais
# produtos. Consome gold.vendas_detalhadas.

resources:
  dashboards:
    diretoria_comercial:
      display_name: "Diretoria Comercial"
      file_path: ../src/dashboards/diretoria_comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
      permissions:
        - group_name: diretoria_comercial
          level: CAN_RUN
        - group_name: analista_bi
          level: CAN_RUN
        - group_name: engenheiro_dados
          level: CAN_RUN
