# The main pipeline for ecommerce_lakehouse

resources:
  pipelines:
    ecommerce_lakehouse_etl:
      name: ecommerce_lakehouse_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ecommerce_lakehouse_etl"

      # Lido nas tabelas bronze (spark.conf.get) para montar o caminho do Volume de landing
      # do ambiente.
      configuration:
        catalogo: ${var.catalog}

      libraries:
        - glob:
            include: ../src/ecommerce_lakehouse_etl/transformations/**
