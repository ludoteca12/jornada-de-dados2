# Job "Pipeline E-commerce": atualiza a camada silver e, na sequência, roda os testes de
# qualidade. Se os testes falharem, o job falha (o notebook lança AssertionError).

resources:
  jobs:
    pipeline_ecommerce:
      name: "Pipeline E-commerce"

      parameters:
        - name: catalogo
          default: ${var.catalog}

      tasks:
        - task_key: atualizar_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.jornadadedados_etl.id}

        - task_key: testes_qualidade
          depends_on:
            - task_key: atualizar_silver
          notebook_task:
            notebook_path: ../testes/testes_qualidade.py
            base_parameters:
              catalogo: "{{job.parameters.catalogo}}"
