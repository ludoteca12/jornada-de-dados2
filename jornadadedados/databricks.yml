    default: true
    workspace:
      host: https://dbc-b2999451-9f53.cloud.databricks.com
    variables:
      catalog: jornada-de-dados
      schema: silver
  prod:
    mode: production
    workspace:
      host: https://dbc-b2999451-9f53.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mateusvvas@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mateusvvas@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: jornada-de-dados
      schema: silver
    permissions:
      - user_name: mateusvvas@gmail.com
        level: CAN_MANAGE
