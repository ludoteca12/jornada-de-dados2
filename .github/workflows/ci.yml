# CI: valida o bundle nos dois ambientes a cada PR e a cada push na main.
# Autentica como o service principal sp_ci_github (OAuth M2M). Configuração no repositório:
#   secrets:   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
#   variables: DATABRICKS_PROD_OWNER (email do dono de prod; o CI não é o dono)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar bundle (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    defaults:
      run:
        working-directory: ecommerce_lakehouse
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxe dos arquivos Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: JSON válido (dashboards e Genie)
        run: for f in $(git ls-files 'src/*.json'); do python -m json.tool "$f" > /dev/null || exit 1; done

      - uses: databricks/setup-cli@v1.17.0

      # Sem DATABRICKS_PROD_OWNER o validate ainda passa, mas checa a pasta do próprio service
      # principal em vez da pasta real de prod.
      - name: databricks bundle validate --strict
        run: >-
          databricks bundle validate -t ${{ matrix.target }} --strict
          ${{ vars.DATABRICKS_PROD_OWNER && format('--var prod_owner={0}', vars.DATABRICKS_PROD_OWNER) || '' }}
